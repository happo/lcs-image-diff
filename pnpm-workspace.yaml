# Defines the root of the pnpm workspace

# Settings migrated from .npmrc (pnpm 11 no longer reads .npmrc for these)
linkWorkspacePackages: true
hoistPattern:
  - '*'
publicHoistPattern:
  - '*eslint*'
  - '*prettier*'
strictPeerDependencies: false
autoInstallPeers: true
savePrefix: ''
dedupePeerDependents: true
allowBuilds:
  # tsx runs on esbuild, which needs its binary linked at install time.
  esbuild: true
  sharp: true

  # Optional native speedups for jest and its resolver. Both ship prebuilt
  # binaries and fall back gracefully, so there is no reason to compile them.
  '@parcel/watcher': false
  unrs-resolver: false

# Match dependabot npm cooldown (default-days: 2 in .github/dependabot.yml)
minimumReleaseAge: 2880

minimumReleaseAgeExclude:
  - release-with-ease
