# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2

updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: daily
    cooldown:
      default-days: 2
    groups:
      # An update joins the FIRST group it matches, so these have to come
      # before the catch-all below -- otherwise it takes their patches and
      # minors and these only ever see majors. Both toolchains have to move
      # in lockstep, which is the whole reason for grouping them.
      babel:
        patterns:
          - '@babel/*'
          - 'babel-*'

      jest:
        patterns:
          - 'jest'
          - '@jest/*'

      patches-and-minors:
        update-types:
          - 'patch'
          - 'minor'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types:
          - 'patch'
          - 'minor'
          - 'major'
