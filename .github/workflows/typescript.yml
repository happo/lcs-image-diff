name: TypeScript

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_COLOR: 1

jobs:
  tsc:
    runs-on: ubuntu-latest
    name: tsc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-env
      - run: pnpm tsc
      - name: Check that the package builds
        run: pnpm run build
