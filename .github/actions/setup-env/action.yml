name: Setup Environment
description: 'Sets up pnpm and Node, then installs dependencies.'

inputs:
  node-version:
    description: 'Node.js version to use. Defaults to the one in mise.toml.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    # pnpm has to be on PATH before setup-node, which shells out to it to
    # locate the store it caches.
    - name: Setup pnpm
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      with:
        version: 11
        run_install: false

    # setup-node can read mise.toml itself, but only on its unreleased main
    # branch. Every released version falls back to a regex that picks up the
    # literal `[tools]` and then fails to find a Node build for it, so the
    # version is read here instead. Keeps mise.toml the one place it lives.
    - name: Resolve Node version
      id: node
      shell: bash
      env:
        NODE_VERSION_INPUT: ${{ inputs.node-version }}
      run: |
        set -euo pipefail
        version="$NODE_VERSION_INPUT"
        if [ -z "$version" ]; then
          version="$(sed -n 's/^node[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' mise.toml | head -1)"
        fi
        if [ -z "$version" ]; then
          echo "Could not find a node version in mise.toml" >&2
          exit 1
        fi
        echo "Using Node $version"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Setup Node
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
      with:
        node-version: ${{ steps.node.outputs.version }}
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
